name: TraceForge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: traceforge
          POSTGRES_PASSWORD: traceforge
          POSTGRES_DB: traceforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traceforge -d traceforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://traceforge:traceforge@localhost:5432/traceforge
      REDIS_URL: redis://localhost:6379/0
      GEMINI_API_KEY: ci-placeholder
      GEMINI_MODEL: gemini-3.8-flash
      GITHUB_PERSONAL_ACCESS_TOKEN: ci-placeholder
      JWT_SECRET_KEY: ci-only-secret-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest tests -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-build:
    name: Validate Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t traceforge-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t traceforge-frontend:ci ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000